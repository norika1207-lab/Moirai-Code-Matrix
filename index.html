<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moirai — 4 windows</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg:#F5F5F7; --panel:#FFFFFF; --rail:#F2F2F2; --line:rgba(0,0,0,.08); --txt:#1D1D1F; --dim:#6E6E73;
    --claude:#E8730A; --codex:#34C759; --both:#0071E3; --user:#0071E3; --accentbg:#EAF3FF;
    --danger:#FF3B30; --shadow-xs:0 1px 2px rgba(0,0,0,.06); --shadow-sm:0 2px 10px rgba(0,0,0,.08); --shadow-md:0 6px 24px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box}
  html,body{width:100%;overflow-x:hidden}
  body{margin:0;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
       background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:6px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);box-shadow:var(--shadow-xs)}
  button.mini{padding:4px 10px;font-size:11px;border-radius:7px}
  .brand{display:flex;align-items:center;gap:8px}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--txt)}
  header .sub{color:var(--dim);font-size:12px}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  button{background:var(--panel);color:var(--txt);border:1px solid var(--line);
          border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;box-shadow:var(--shadow-xs)}
  button:hover{border-color:#C7C7CC}

  /* top panels: token cards (one per window) + watchdog */
  .panels{padding:4px 0;display:flex;flex-direction:column;gap:4px;background:var(--bg);border-bottom:1px solid var(--line)}
  .prow{display:flex;align-items:center;min-height:26px;padding:0 8px}
  .bstrip{display:flex;gap:8px;flex:1;min-width:0;align-items:center;flex-wrap:wrap}
  .bnote{color:var(--dim);font-size:12px}
  .bpill{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;
         font-size:11px;border:1px solid var(--line);color:var(--dim);white-space:nowrap;background:var(--panel)}
  .bpill.ok{color:#1E8E3E;border-color:#B7E4C7;background:#EFFBF3}
  .bpill.warn{color:#D93025;border-color:#FAD2CF;background:#FDF0EF}
  .bpill.circle{color:#fff;border-color:#FF3B30;background:#FF3B30;font-weight:700}
  .tcards{display:flex;gap:8px;flex:1;min-width:0}
  .tcard{flex:1;min-width:0;display:flex;align-items:center;gap:10px;
         background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 14px;box-shadow:var(--shadow-xs)}
  .tcard .vn{flex:none;font-size:12px;font-weight:700}
  .tcard.claude .vn{color:var(--claude)} .tcard.codex .vn{color:var(--codex)}
  .kgroup{flex:1;display:flex;align-items:center;justify-content:space-evenly;gap:8px;min-width:0}
  .tcard .kpi{display:flex;flex-direction:column;line-height:1.15}
  .tcard .kpi b{font-size:12px;font-weight:700}
  .tcard .kpi span{font-size:9px;color:var(--dim);letter-spacing:.3px}
  .clearbtn{flex:none;font-size:10px;padding:4px 8px;border-radius:7px;background:var(--rail);
            border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .clearbtn:hover{border-color:var(--user);color:var(--user)}

  /* 2x2 layout: [left rails][left grid][right grid][right rails] */
  .stage{flex:1;display:flex;gap:1px;overflow:hidden;min-height:0;background:var(--line)}
  .railcol{width:210px;flex:none;display:flex;flex-direction:column;background:var(--rail);min-height:0}
  .railcol .rail{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-bottom:1px solid var(--line)}
  .railcol .rail:last-child{border-bottom:none}
  .gridcol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .gridcol .col{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);overflow:hidden;border-bottom:1px solid var(--line)}
  .gridcol .col:last-child{border-bottom:none}

  .rail .newlink{padding:9px 12px 5px;font-size:12px;font-weight:600;cursor:pointer;display:flex;
                 align-items:center;gap:5px;white-space:nowrap;user-select:none;color:var(--claude)}
  .rail .newlink:hover{filter:brightness(1.15);text-decoration:underline}
  .rail .rhead{padding:6px 12px;font-size:11.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
               display:flex;align-items:center;gap:6px;color:var(--dim)}
  .rail .rhead .d{width:8px;height:8px;border-radius:50%;background:var(--claude)}
  .rail .rhead .rtitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .rhead .rf,.rail .rhead .hidtog{cursor:pointer}
  .rhead .hidtog.on{color:var(--user)}
  .rlist{flex:1;overflow-y:auto;padding:5px}
  .ghead{display:flex;align-items:center;gap:5px;padding:6px 6px;margin-top:3px;cursor:pointer;
         font-size:11px;color:var(--dim);border-radius:6px;position:sticky;top:0;background:var(--rail)}
  .ghead:hover{background:rgba(0,0,0,.04)}
  .ghead .gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .gcount{margin-left:auto;color:#AEAEB2}
  .ghead .arr{width:10px;display:inline-block;transition:transform .12s}
  .sgroup.collapsed .arr{transform:rotate(-90deg)}
  .sgroup.collapsed .gbody{display:none}
  .sitem{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;line-height:1.4}
  .sitem:hover{background:rgba(0,0,0,.04)}
  .sitem.active{background:var(--accentbg);border-color:#BFE0FF}
  .sitem .ico{color:#AEAEB2;font-size:10px;flex:none;margin-top:2px}
  .sitem .lbl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;flex:1}
  .sitem .dots{flex:none;opacity:0;color:var(--dim);padding:0 4px;border-radius:4px;font-weight:700}
  .sitem:hover .dots{opacity:1}
  .sitem .dots:hover{background:rgba(0,0,0,.08);color:var(--txt)}
  .sitem.pin .ico{color:var(--user)} .sitem.arch{opacity:.5}
  .ctxmenu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;
           padding:4px;min-width:160px;box-shadow:var(--shadow-md)}
  .ctxmenu .ci{padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  .ctxmenu .ci:hover{background:rgba(0,0,0,.05)}
  .ctxmenu .ci.danger{color:var(--danger)}

  /* per-window title bar */
  .colhead{display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:none;position:relative;
           background:rgba(255,255,255,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex:none;box-shadow:var(--shadow-xs)}
  .colhead .cdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--claude)}
  .colhead .engsel{background:none;color:var(--dim);border:none;border-radius:6px;
                   padding:3px 6px;font-size:11px;cursor:pointer;flex:none}
  .colhead .engsel:hover{background:rgba(0,0,0,.05);color:var(--txt)}
  .colhead .msel{background:none;color:var(--dim);border:none;border-radius:6px;
                 padding:3px 6px;font-size:11px;cursor:pointer;flex:none;max-width:100px}
  .colhead .msel:hover{background:rgba(0,0,0,.05);color:var(--txt)}
  .colhead .msel.remote{background:var(--accentbg);color:var(--user);border-radius:20px}
  .colhead .loginbtn{font-size:10px;padding:2px 7px;border-radius:6px;flex:none;
                     background:#EFFBF3;border:1px solid #B7E4C7;color:#1E8E3E;cursor:pointer;display:none}
  .colhead .loginbtn:hover{border-color:#34C759;color:#166B32}
  .colhead .cname{font-size:12px;font-weight:600;color:var(--txt);cursor:text;flex:1 1 auto;min-width:72px;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                  border:1px solid transparent;border-radius:6px;padding:2px 6px}
  .colhead .cname:hover{border-color:var(--line)}
  .colhead .cname:focus{border-color:var(--user);outline:none;background:var(--bg)}
  .colhead .stopbtn{font-size:11px;width:22px;height:22px;padding:0;border-radius:6px;flex:none;
                    background:transparent;border:none;color:var(--danger);cursor:pointer}
  .colhead .stopbtn:hover{background:#FDF0EF}
  .colhead .stopbtn:disabled{opacity:0;cursor:default;pointer-events:none}
  /* M2 交接規則 */
  .handoffpop{position:absolute;top:calc(100% + 6px);right:0;z-index:90;min-width:280px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow-md);padding:8px;text-align:left;cursor:default;font-weight:400}
  .handoffpop .hhead{font-size:11.5px;color:var(--dim);padding:2px 6px 7px;border-bottom:1px solid var(--line)}
  .handoffpop .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 6px}
  .handoffpop .hname{font-size:12.5px;color:var(--txt)}
  .handoffpop .hopts{display:flex;gap:3px}
  .handoffpop .hopt{font-size:10.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);
    background:var(--rail);color:var(--dim);cursor:pointer}
  .handoffpop .hopt.on{background:var(--user);border-color:var(--user);color:#fff}
  .handoffpop .hfoot{font-size:10.5px;color:var(--dim);padding:7px 6px 2px;border-top:1px solid var(--line);line-height:1.5}
  .autonote{font-size:11px;color:#1E8E3E;padding:5px 0 0}
  #gatebar{border-top:1px solid #FFD08A;background:#FFF9F0;padding:6px 14px;display:flex;
    flex-direction:column;gap:5px;flex:none}
  #gatebar .grow{display:flex;align-items:center;gap:9px;font-size:12px}
  #gatebar .gtxt{color:#B25900;flex:none}
  #gatebar .gprev{color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #gatebar .gbtn{font-size:11px;padding:3px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:#fff}
  #gatebar .gbtn.go{background:var(--user);border-color:var(--user);color:#fff}
  .colhead .respbtn{font-size:11px;height:22px;padding:0 8px;border-radius:6px;position:relative;
    flex:0 1 auto;min-width:56px;max-width:110px;white-space:nowrap;
                    background:none;border:none;color:var(--dim);cursor:pointer;font-weight:600;
                    display:flex;align-items:center;justify-content:center}
  .colhead .respbtn > .rlabel{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .colhead .respbtn:hover{background:rgba(0,0,0,.05);color:#B25900}
  .colhead .respbtn.active{background:#FFF3E0;color:#B25900}

  .log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .msg{max-width:100%;padding:3px 2px;word-break:break-word}
  .msg.user{border-left:none;padding-left:12px;margin-top:5px;border-radius:2px 12px 12px 12px;background:var(--accentbg)}
  .msg.user .mdl{color:var(--txt)}
  .msg .who{font-size:11px;color:var(--dim);margin-bottom:2px}
  .msg.sys{color:var(--dim);font-size:11px;border-left:2px solid var(--line);padding-left:9px}
  .mdl{line-height:1.55} .mdh{font-weight:700;font-size:14px;margin:8px 0 3px} .mdsp{height:7px}
  .msg ul{margin:3px 0;padding-left:18px} .msg li{line-height:1.5;margin:1px 0}
  .tblwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px}
  table.mdtbl{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  table.mdtbl th,table.mdtbl td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:normal}
  table.mdtbl th{background:var(--rail);font-weight:600;color:var(--txt);border-bottom:1px solid var(--line)}
  table.mdtbl tbody tr:last-child td{border-bottom:none}
  table.mdtbl tbody tr:hover td{background:rgba(0,0,0,.025)}
  code{background:#F2F2F3;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#B2470E;
       font-family:ui-monospace,Menlo,monospace;font-size:12px}
  /* highlight.js atom-one-light 已經是亮底,只需確保跟我們自己的容器背景一致 */
  pre.cb code.hljs{background:transparent}
  .cbwrap{position:relative;margin:6px 0}
  pre.cb{background:#FAFAFB;border:1px solid var(--line);border-radius:8px;padding:9px 12px;overflow-x:auto;margin:0}
  pre.cb code{background:none;border:none;padding:0;font-size:12px;white-space:pre;line-height:1.5}
  .cblang{position:absolute;top:7px;left:12px;font-size:10px;color:#AEAEB2;font-family:ui-monospace,Menlo,monospace;pointer-events:none;letter-spacing:.3px;text-transform:uppercase}
  .copybtn{position:absolute;top:6px;right:8px;font-size:10px;padding:2px 8px;border-radius:5px;
           background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer;opacity:0;transition:opacity .12s;box-shadow:var(--shadow-xs)}
  .cbwrap:hover .copybtn{opacity:1}
  .copybtn:hover{border-color:var(--user);color:var(--user)}
  /* attachment chips: tiny thumbnails of dropped files, sit INLINE at the front of the input row (before the typed text) */
  .chips{display:none;gap:4px;align-items:center;flex:none;padding:0 2px;max-width:42%;overflow-x:auto;
         scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:6px;
        background:var(--rail);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
  .chip img{width:100%;height:100%;object-fit:cover;transition:opacity .12s}
  .chip .fic{font-size:16px;transition:opacity .12s}
  .chip:hover{border-color:var(--user)}
  .chip:hover img,.chip:hover .fic{opacity:.45}   /* dim the thumbnail so the X reads clearly */
  /* hover a chip -> a round X badge appears at its top-right; click it to drop that file */
  .chip .x{position:absolute;top:1px;right:1px;width:15px;height:15px;border-radius:50%;
           background:var(--txt);border:1px solid #fff;color:#fff;font-size:10px;font-weight:700;line-height:1;
           display:flex;align-items:center;justify-content:center;cursor:pointer;
           opacity:0;transform:scale(.5);transition:opacity .12s,transform .12s}
  .chip:hover .x{opacity:1;transform:scale(1)}
  .chip .x:hover{background:var(--danger)}
  .msgchips{display:flex;gap:4px;margin:2px 0 4px;flex-wrap:wrap;align-items:center}
  .msgchips img{width:22px;height:22px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
  .msgchips span{font-size:14px}
  body.dragover::after{content:"拖放檔案加入訊息 ⤵";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,113,227,.08);color:var(--user);font-size:18px;z-index:99;pointer-events:none;border:2px dashed var(--user)}
  .msg .acts{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}
  .msg .act{font-size:11px;padding:3px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer;box-shadow:var(--shadow-xs)}
  .msg .act:hover{border-color:var(--user);color:var(--user)}
  .step{font-size:11.5px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;
        border-left:2px solid var(--line);padding:2px 0 2px 8px;margin:3px 0;white-space:pre-wrap;word-break:break-all}
  /* Claude-terminal-style tool call: one-line summary, click to expand/collapse the detail */
  .toolblk{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;margin:3px 0}
  .toolhdr{display:flex;gap:6px;align-items:center;cursor:pointer;color:#3A3A3C;
           white-space:pre-wrap;word-break:break-all;user-select:none}
  .toolhdr:hover{color:var(--txt)}
  .toolhdr .bullet{color:#1A7F3C;flex:none}
  .toolhdr .tsum{flex:1;min-width:0}
  .toolhdr .chev{color:#AEAEB2;flex:none;font-size:10px;transition:transform .12s}
  .toolblk.open .toolhdr .chev{transform:rotate(90deg)}
  .tooldetail{display:none;color:#6E6E73;font-size:11px;padding:3px 0 4px 18px;
              white-space:pre-wrap;word-break:break-all}
  .toolblk.open .tooldetail{display:block}
  .tdline{margin:1px 0}
  .tdline.dim{color:#AEAEB2}
  .toolout-md{padding:4px 0 4px 14px;font-size:11px;color:#6E6E73}
  .toolout-md .cbwrap{margin:3px 0}
  .toolout-md pre.cb{font-size:11px;padding:6px 10px}
  /* fallback for a tool_result with no matching tool_use */
  .toolout{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6E6E73;margin:1px 0 4px;
           padding-left:6px;display:flex;gap:6px;white-space:pre-wrap;word-break:break-all}
  .toolout .corner{color:#AEAEB2;flex:none}
  /* slash-command palette (type "/" in the composer) */
  .cmdmenu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;max-height:262px;overflow-y:auto;
           background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;display:none;z-index:50;
           box-shadow:var(--shadow-md)}
  .cmdmenu.on{display:block}
  .cmdit{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-radius:7px;cursor:pointer}
  .cmdit.sel{background:var(--accentbg)}
  .cmdit .cc{font-family:ui-monospace,Menlo,monospace;color:var(--user);font-size:12.5px;font-weight:700;flex:none;min-width:78px}
  .cmdit .ce{color:var(--txt);font-size:12.5px;flex:none}
  .cmdit .cz{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
  /* clickable file paths (open in Finder) and URLs (open in browser) inside chat output */
  .fpath{color:var(--user);cursor:pointer;border-bottom:1px dashed #0071E366;word-break:break-all}
  .fpath:hover{color:#0058B0;border-bottom-color:#0058B0;background:#0071E314}
  a.ext{color:var(--user);text-decoration:none;border-bottom:1px solid #0071E355;word-break:break-all}
  a.ext:hover{color:#0058B0;border-bottom-color:#0058B0}
  .toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--txt);border:1px solid var(--line);
    color:#fff;padding:8px 15px;border-radius:9px;font-size:13px;z-index:120;opacity:0;transition:opacity .18s;
    pointer-events:none;box-shadow:var(--shadow-md);max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast.on{opacity:1}
  /* dispatched sub-agents / workflow — nothing clipped: the row wraps instead of ellipsising */
  .agentrow{display:flex;align-items:flex-start;gap:7px;margin:4px 0;padding:5px 9px;border-radius:8px;
            border:1px solid var(--line);background:var(--panel);font-size:12px;flex-wrap:wrap;box-shadow:var(--shadow-xs)}
  .agentrow .ai{flex:none}
  .agentrow .an{font-weight:700;color:#8B5CF6;flex:none}
  .agentrow .ad{color:var(--dim);flex:1;min-width:120px;white-space:pre-wrap;word-break:break-word}
  .agentrow .as{flex:none;font-size:11px;padding:1px 7px;border-radius:999px;white-space:pre-wrap;word-break:break-word}
  .agentrow.run{border-color:#FFE0B2}
  .agentrow.run .as{color:#B25900;background:#FFF3E0;animation:thinkpulse 1.4s ease-in-out infinite}
  .agentrow.done{opacity:.85}
  .agentrow.done .as{color:#1E8E3E;background:#EFFBF3}
  /* shared-content marker: this window was fed what the other windows did */
  .sharedrow{display:flex;align-items:center;gap:7px;margin:4px 0;padding:4px 9px;border-radius:8px;
             border:1px solid #BFE0FF;background:var(--accentbg);color:var(--user);font-size:11.5px}
  .sharedrow .si{flex:none}
  .thinking{color:var(--dim);font-style:italic;font-size:12.5px;display:flex;gap:5px;align-items:center;padding:2px 0}
  .thinking .tt{animation:thinkpulse 1.5s ease-in-out infinite}
  .thinking .dots{display:inline-block;letter-spacing:2px;animation:thinkblink 1.1s steps(3,end) infinite}
  @keyframes thinkpulse{0%,100%{opacity:.4}50%{opacity:1}}
  @keyframes thinkblink{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  .divider{align-self:center;color:var(--dim);font-size:11px;border-top:1px dashed var(--line);width:100%;text-align:center;padding-top:7px}
  .compactrow{font-size:11px;color:#1E8E3E;border:1px solid #B7E4C7;background:#EFFBF3;border-radius:7px;padding:5px 12px;margin:4px 0;display:flex;align-items:center;gap:5px}
  .cfgbar{display:flex;align-items:center;gap:5px;padding:5px 12px;border-top:1px solid var(--line);
          background:var(--panel);flex:none;flex-wrap:nowrap;overflow:visible;position:relative}
  .cfgbar .tag{font-size:11px;color:var(--dim);flex:none}
  .cfgbtn{background:var(--rail);color:var(--txt);border:1px solid var(--line);border-radius:6px;
                 padding:3px 7px;font-size:11px;cursor:pointer;max-width:112px;flex:none;
                 display:flex;align-items:center;gap:3px;white-space:nowrap;position:relative}
  .cfgbtn span{overflow:hidden;text-overflow:ellipsis}
  .cfgbtn .chev{flex:none;font-size:8px;color:var(--dim);transform:translateY(1px)}
  .cfgbtn.open{border-color:var(--user);background:var(--accentbg);color:var(--user)}
  .cfgbar .fastbtn{padding:3px 8px;font-size:11px;border-radius:6px;background:var(--rail);flex:none;border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .cfgbar .fastbtn.on{background:#FFF3E0;border-color:#FFD08A;color:#B25900}

  .cfgpanel{position:absolute;bottom:calc(100% + 6px);left:0;min-width:220px;background:var(--panel);
            border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px;
            z-index:80;font-size:12.5px}
  .cfgpanel .opt{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .cfgpanel .opt:hover{background:var(--rail)}
  .cfgpanel .opt .ck{flex:none;width:14px;color:var(--user);font-size:11px;padding-top:1px}
  .cfgpanel .opt .body{flex:1;min-width:0}
  .cfgpanel .opt .lbl{display:flex;align-items:center;gap:6px;color:var(--txt)}
  .cfgpanel .opt .badge{font-size:9.5px;color:var(--dim);background:var(--rail);border:1px solid var(--line);
                         border-radius:5px;padding:0 4px}
  .cfgpanel .opt .desc{font-size:10.5px;color:var(--dim);margin-top:1px;line-height:1.35}
  .cfgpanel .opt .num{flex:none;font-size:10.5px;color:var(--dim)}
  .cfgpanel .sep{border-top:1px solid var(--line);margin:5px 2px}
  .cfgpanel .more{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;
                   border-radius:8px;cursor:pointer;color:var(--txt)}
  .cfgpanel .more:hover{background:var(--rail)}
  .cfgpanel .more .chev{color:var(--dim);font-size:10px}
  .cfgpanel .submenu{position:absolute;left:calc(100% + 6px);bottom:0;min-width:170px;background:var(--panel);
                      border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);padding:6px}
  .cfgpanel .togglerow{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;color:var(--dim);font-size:11.5px}
  .cfgpanel .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;flex:none}
  .cfgpanel .sw.on{background:var(--user)}
  .cfgpanel .sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
                   box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
  .cfgpanel .sw.on i{left:14px}
  .cfgpanel.effortpanel{min-width:240px;padding:12px 14px}
  .cfgpanel .efflabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:8px}
  .cfgpanel .effcur{color:var(--user);font-weight:600}
  .cfgpanel input[type=range]{width:100%;accent-color:var(--user)}

  footer{border-top:1px solid var(--line);padding:9px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--panel)}
  .targets{display:flex;gap:6px;flex-wrap:wrap}
  .targets button{height:40px;font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .targets button.on{border-color:var(--user);color:var(--user);background:var(--accentbg)}
  /* THE input box is .inputwrap itself. the target label, the attachment chips and the textarea
     all live INSIDE that single border, so chips sit at the front of the command, never outside it. */
  .inputwrap{flex:1;position:relative;display:flex;align-items:center;
             border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-right:42px;box-shadow:var(--shadow-xs)}
  .inputwrap:focus-within{border-color:var(--user)}
  .tgtprefix{display:flex;align-items:center;padding:0 4px 0 11px;font-size:13px;font-weight:700;flex:none;
             border:none;background:transparent;cursor:pointer;white-space:nowrap;user-select:none;
             color:var(--user);max-width:140px;overflow:hidden}
  textarea{flex:1;resize:none;background:transparent;color:var(--txt);border:none;outline:none;
           padding:9px 0 9px 6px;font:14px/1.4 inherit;height:40px;min-height:40px;max-height:158px}
  .sendico{position:absolute;right:6px;bottom:6px;width:28px;height:28px;padding:0;border-radius:8px;
           display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
           background:var(--user);border-color:var(--user);color:#fff;transition:background .15s,border-color .15s,border-radius .15s}
  .sendico.running{background:var(--danger);border-color:var(--danger);font-size:12px;border-radius:7px}
  .sendico.running:hover{background:#E0271D;border-color:#E0271D}
  .plus{width:36px;height:40px;flex:none;font-size:18px;line-height:1;color:var(--dim);
        background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .plus:hover{border-color:var(--user);color:var(--user)}
  /* 2-window layout: hide the bottom window of each column (w2/w4) and their rails */
  /* 2-column mode: which two windows are shown is chosen at runtime, not hard-coded */
  .col.hid,.rail.hid{display:none !important}
  /* in 2-column mode each visible window gets a chip to swap to its sibling on that side */
  .swapbtn{display:none;font-size:11px;padding:3px 9px;border-radius:7px;flex:none;
           border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer}
  .swapbtn:hover{border-color:var(--user);color:var(--user)}
  .stage.two .swapbtn{display:inline-block}
  /* role UI: each window carries an editable role (name + brief), decoupled from its internal id */
  .colhead .rolelbl{font-size:10px;color:var(--dim);flex:none;padding:1px 7px;border:1px solid var(--line);
                    border-radius:999px;white-space:nowrap;user-select:none}
  .colhead .briefbtn{font-size:11px;padding:3px 8px;border-radius:7px;flex:none;background:none;
                     border:none;color:var(--dim);cursor:pointer}
  .colhead .briefbtn:hover{background:rgba(0,0,0,.05);color:var(--user)}
  .nmodal input.rname{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;
                      padding:9px 11px;font:14px/1.5 inherit}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:80;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  .mask.on{display:flex}
  .nmodal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(640px,92vw);
          padding:20px 22px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-md)}
  .nmtitle{font-size:17px;font-weight:700}
  .nmlbl{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.3px}
  .nmodal select,.nmodal textarea{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:14px/1.5 inherit}
  .nmodal textarea{min-height:120px;max-height:320px;resize:vertical}
  .nmrow{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  #newgo{background:var(--user);border-color:var(--user);color:#fff;font-weight:600;padding:8px 18px}
</style>
</head>
<body>
  <header>
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 120 120">
        <rect x="4" y="4" width="112" height="112" rx="26" fill="#1D1D1F"/>
        <path d="M40,28 C 52,44 34,58 52,68 C 66,76 44,88 60,96" fill="none" stroke="#E8730A" stroke-width="6" stroke-linecap="round"/>
        <path d="M60,22 C 48,42 76,54 52,64 C 34,72 78,80 60,96" fill="none" stroke="#34C759" stroke-width="6" stroke-linecap="round"/>
        <path d="M80,28 C 68,44 88,58 68,68 C 52,76 76,88 60,96" fill="none" stroke="#0071E3" stroke-width="6" stroke-linecap="round"/>
      </svg>
      <h1>Moirai</h1>
    </span>
    <span class="sub">多角色協作 · 訂閱制,免 API</span>
    <div class="right">
      <span id="projlabel" class="sub" title="Shared project directory">Project: none</span>
      <button id="layoutbtn" class="mini" title="Switch between 2 and 4 windows">⊞ 4窗</button>

  <div class="panels">

  <div class="mask" id="newmask">

      <select id="newrolepreset">
        <option value="pm">PM · 規劃</option>

        <option value="audit">Audit · 稽核</option>
        <option value="qa">QA · 測試</option>
        <option value="custom">自訂…</option>
      </select>
      <input class="rname" id="newrolename" placeholder="例如 PM、後端、審查、測試…">
      <textarea id="newrolebrief" placeholder="這個角色要做什麼?" style="min-height:64px"></textarea>
      <div class="nmlbl">Attach to project (working directory)</div>
      <select id="newproj"></select>
      <div class="nmlbl">First message</div>
      <textarea id="newmsg" placeholder="What should this session start with?"></textarea>
      <div class="nmrow"><button id="newcancel" class="mini">Cancel</button><button id="newgo">Start</button></div>
    </div>
  </div>

  <div class="mask" id="rolemask">
    <div class="nmodal">
      <div class="nmtitle" id="roletitle">設定角色</div>
      <div class="nmlbl">角色類型(選一個,名稱跟職責會自動帶好;要自己寫再選「自訂」)</div>
      <select id="rolepreset">
        <option value="pm">PM · 規劃</option>
        <option value="dev">Dev · 實作</option>
        <option value="audit">Audit · 稽核</option>
        <option value="qa">QA · 測試</option>
        <option value="custom">自訂…</option>
      </select>
      <div class="nmlbl">角色名稱(顯示在這個視窗、發送目標、共享記憶裡)</div>
      <input class="rname" id="rolename" placeholder="例如 PM、後端、審查、測試…">
      <div class="nmlbl">角色職責(交棒給這個角色時,會把這段職責指令加在上一棒產出前面)</div>
      <textarea id="rolebrief" placeholder="這個角色要做什麼?例如:實作規格、審查程式碼抓 bug、寫測試…"></textarea>
      <div class="nmrow"><button id="rolecancel" class="mini">取消</button><button id="rolego">儲存</button></div>
    </div>
  </div>

<script>
// ===== windows (panes) =====
// w1..w4 are INTERNAL ids only (never shown to the user). Everything a person sees — the role
// name, which column a window lives in, and the pipeline order — is free-form state kept in
// localStorage, NOT wired to the id. So any window can be any role and sit in either column.
const PANES=["w1","w2","w3","w4"];
// default ROLE for each window (fully editable; this is only the seed value).
const DEFAULT_NAME={w1:"PM",w2:"Dev",w3:"Audit",w4:"QA"};
// default role BRIEF: the job handed to this role when the pipeline passes work to it.
const DEFAULT_BRIEF={
  w1:"You are the PM/planning role. Turn the request into a clear, concrete spec: goals, scope, concrete steps, and how we will know it is done. Do not write the final code yourself; hand a precise spec to the next role. Read the project files first.",
  w2:"You are the DEV role. Below is the upstream spec/output. Implement it as working, verified code: follow the spec exactly, do NOT drift or change scope, actually compile/run to confirm it works, and never fabricate results. Read the project files.",
  w3:"You are the AUDIT role. Below is the upstream output. Verify whether it was ACTUALLY implemented and hunt for bugs: check every claim against the real code, cite file:line for each finding, mark anything unconfirmed as unverified, do not fabricate. You are read-only. Read the project files.",
  w4:"You are the QA role. Below is the upstream output. Test the behaviour: design and run unit / stress / security & penetration / automation tests as applicable, and report pass/fail with concrete evidence. Read the project files."
};
// default column placement (A = left column, B = right column). Editable; not wired to the id.
const DEFAULT_COL={w1:"A",w2:"A",w3:"B",w4:"B"};
const paneEngine={w1:"claude",w2:"codex",w3:"claude",w4:"codex"};
// which column each window sits in — the real placement state, replaces the old hard-wired SIDE map.
let colOf={};PANES.forEach(p=>colOf[p]=(localStorage.getItem("duo-col-"+p)==="B"?"B":(localStorage.getItem("duo-col-"+p)==="A"?"A":DEFAULT_COL[p])));
function roleBrief(p){return localStorage.getItem("duo-brief-"+p)||DEFAULT_BRIEF[p]||"Below is the previous stage's output. Continue the task.";}
const ENGNAME={claude:"Claude",codex:"Codex"};
const ENGCOLOR={claude:"var(--claude)",codex:"var(--codex)"};
const lastOutput={}, reviewOnce=new Set();
const activeStreams=new Set();   // panes with a live in-page stream
const orphanLive={};             // panes running server-side with no in-page stream (e.g. after a refresh)
function killThink(L){if(!L)return;if(L.timer){clearInterval(L.timer);L.timer=null;}if(L.think){L.think.remove();L.think=null;}}
const logs={}, tags={}, rails={};
let target="all";

// ---- build DOM ----
// Two columns A|B. Each window's rail + col node is built once and kept in a map; applyLayout()
// moves the visible ones into the right column container, so placement can change at runtime.
const railNode={}, colNode={};
let railA,gridA,gridB,railB;
(function build(){
  const stage=document.getElementById("stage");
  railA=div("railcol"); gridA=div("gridcol"); gridB=div("gridcol"); railB=div("railcol");
  PANES.forEach(p=>{railNode[p]=railEl(p);colNode[p]=colEl(p);});
  stage.append(railA,gridA,gridB,railB);
  // targets
  const tg=document.getElementById("targets");
  PANES.forEach(p=>{const b=document.createElement("button");b.dataset.t=p;b.textContent=DEFAULT_NAME[p];tg.appendChild(b);});
  const ab=document.createElement("button");ab.dataset.t="all";ab.textContent="All";ab.classList.add("on");tg.appendChild(ab);
})();
function div(cls){const d=document.createElement("div");d.className=cls;return d;}
function colEl(p){
  const col=div("col");col.dataset.pane=p;
  col.innerHTML=`<div class="colhead">
      <span class="cdot"></span>
      <select class="engsel" data-col="${p}"><option value="claude">Claude</option><option value="codex">Codex</option></select>
      <select class="msel" data-col="${p}" title="選機器：local 或 SSH remote"><option value="">local</option></select>
      <button class="loginbtn" data-col="${p}" title="在該機器上執行 claude login，取得授權連結">Login</button>
      <span class="rolelbl" title="這個視窗扮演的角色。點右邊名字可改,點『職責』可設定它的工作內容。">角色</span>
      <span class="cname" contenteditable="true" spellcheck="false" data-col="${p}" title="點一下就能改角色名稱">${escapeHtml(localStorage.getItem("duo-name-"+p)||DEFAULT_NAME[p])}</span>
      <button class="briefbtn" data-col="${p}" title="設定這個角色的職責(交棒給它時會用到)">職責</button>
      <button class="stopbtn" data-col="${p}" disabled title="停止這個視窗 (ESC 停全部)">■</button>
      <button class="respbtn" data-col="${p}" title="設定這個視窗做完之後要自動交給誰。設定一次就長期有效,不用每輪按。">交給…</button>
      <button class="swapbtn" data-col="${p}" title="雙欄模式:切換這一欄要顯示哪個視窗">⇄</button>
    </div>
    <div class="log" id="log-${p}"></div>
    <div class="cfgbar" data-e="${p}"><span class="tag" id="t-${p}">idle</span></div>`;
  logs[p]=col.querySelector(".log"); tags[p]=col.querySelector(".tag");
  return col;
}
function railEl(p){
  const rail=div("rail");rail.dataset.pane=p;
  rail.innerHTML=`<a class="newlink" data-e="${p}" title="Start a new conversation">+ New chat</a>
    <div class="rhead"><span class="d"></span><span class="rtitle">history</span>
      <span class="hidtog" data-e="${p}" title="Show/hide archived">Archived</span>
      <span class="rf" data-e="${p}" title="Refresh">⟳</span></div>
    <div class="rlist" id="rail-${p}">Loading…</div>`;
  rails[p]=rail.querySelector(".rlist");
  return rail;
}

// ---- helpers ----
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
// turn file paths (-> Finder) and URLs (-> browser) in chat text into clickable links.
// runs on already-escaped text, AFTER inline code/bold, so <code>/<strong> tags are safe boundaries.
const FILE_RE=/(https?:\/\/[^\s<>"'`　-〿一-鿿＀-￯]+)|(\/(?:Users|Volumes|opt|home|private|tmp|etc|var)\/[^\s<>"'`　-〿一-鿿＀-￯]+)|([\p{L}\p{N}_\-./]+\.(?:md|markdown|py|js|mjs|cjs|ts|tsx|jsx|json|ya?ml|html?|css|scss|sass|sh|bash|zsh|c|h|hpp|cpp|cc|go|rs|java|kt|swift|rb|php|sql|txt|toml|ini|cfg|conf|env|xml|csv|log|png|jpe?g|gif|svg|webp|pdf|zip|tar|gz|ipa|apk))(?![\p{L}\p{N}])/gu;
const _fp='Open in Finder（點擊在 Finder 定位這個檔）';
function linkify(x){
  return x.replace(FILE_RE,(m,url,abs,file)=>{
    if(url){const c=url.replace(/[.,;:!?)\]]+$/,"");return `<a class="ext" href="${c}" target="_blank" rel="noopener">${c}</a>`+url.slice(c.length);}
    if(abs){const c=abs.replace(/[.,;:!?)\]]+$/,"");return `<span class="fpath" title="${_fp}">${c}</span>`+abs.slice(c.length);}
    return `<span class="fpath" title="${_fp}">${file}</span>`;
  });
}
function cpb(btn){
  const txt=(btn.dataset.c||"").replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  navigator.clipboard.writeText(txt).then(()=>{const o=btn.textContent;btn.textContent="✓ 已複製";setTimeout(()=>btn.textContent=o,1500);}).catch(()=>{});
}
function hlCode(raw,lang){
  if(typeof hljs==="undefined")return escapeHtml(raw);
  try{
    if(lang&&hljs.getLanguage(lang))return hljs.highlight(raw,{language:lang}).value;
    return hljs.highlightAuto(raw).value;
  }catch(e){return escapeHtml(raw);}
}
// markdown table 一列拆成 cell:去掉頭尾的 |,用未跳脫的 | 分割,\| 還原成字面 |
function _tblRow(line){
  let s=line.trim();
  if(s.startsWith('|'))s=s.slice(1);
  if(s.endsWith('|'))s=s.slice(0,-1);
  return s.split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
}
function _tblSep(line){
  if(!/\|/.test(line))return false;
  const cells=_tblRow(line);
  return cells.length>0 && cells.every(c=>/^:?-{1,}:?$/.test(c));
}
function md(raw){
  let s=raw||"";const cb=[],cbLang=[];
  s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{cb.push(code.replace(/\n+$/,""));cbLang.push(lang||"");return "\n@@CB"+(cb.length-1)+"@@\n";});
  s=escapeHtml(s);
  const inl=x=>linkify(x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>"));
  let html="",list=false;const closeL=()=>{if(list){html+="</ul>";list=false;}};
  const lines=s.split("\n");
  for(let i=0;i<lines.length;i++){const ln=lines[i];let m;
    if(m=ln.match(/^@@CB(\d+)@@$/)){closeL();const ci=+m[1];const lang=cbLang[ci];const raw2=cb[ci];
      const enc=raw2.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html+=`<div class="cbwrap">${lang?`<span class="cblang">${escapeHtml(lang)}</span>`:''}<pre class="cb"><code>${hlCode(raw2,lang)}</code></pre><button class="copybtn" data-c="${enc}" onclick="cpb(this)">複製</button></div>`;continue;}
    if(m=ln.match(/^(#{1,4})\s+(.*)$/)){closeL();html+='<div class="mdh">'+inl(m[2])+"</div>";continue;}
    if(m=ln.match(/^\s*[-*]\s+(.*)$/)){if(!list){html+="<ul>";list=true;}html+="<li>"+inl(m[1])+"</li>";continue;}
    // markdown table:這行有 | 且下一行是 |---|---| 分隔線,才當表格開頭(避免把單純含 | 的一般文字誤判)
    if(/\|/.test(ln) && ln.trim() && i+1<lines.length && _tblSep(lines[i+1])){
      closeL();
      const header=_tblRow(ln);
      const aligns=_tblRow(lines[i+1]).map(c=>{
        const l=c.startsWith(':'),r=c.endsWith(':');
        return l&&r?'center':r?'right':l?'left':'';
      });
      const body=[];let j=i+2;
      while(j<lines.length && /\|/.test(lines[j]) && lines[j].trim()){body.push(_tblRow(lines[j]));j++;}
      html+='<div class="tblwrap"><table class="mdtbl"><thead><tr>'
        +header.map((h,ci)=>`<th${aligns[ci]?` style="text-align:${aligns[ci]}"`:''}>${inl(h)}</th>`).join('')
        +'</tr></thead><tbody>'
        +body.map(row=>'<tr>'+row.map((c,ci)=>`<td${aligns[ci]?` style="text-align:${aligns[ci]}"`:''}>${inl(c)}</td>`).join('')+'</tr>').join('')
        +'</tbody></table></div>';
      i=j-1;continue;
    }
    closeL();html+=ln.trim()===""?'<div class="mdsp"></div>':'<div class="mdl">'+inl(ln)+"</div>";}

// click ⇄ on a visible window (2-col mode): cycle THIS column to the next window (any window,
// no id/side restriction), skipping whatever the other column is already showing.
document.addEventListener("click",e=>{

});

// ---- pipeline: forward-only hand-off, roles are per-window and fully editable ----
// The order is the natural window order (w1 -> w2 -> w3 -> w4). Each hand-off carries the NEXT
// window's own role brief, so renaming/reassigning a role changes the pipeline with no hard-coding.
// Forward-only (last window stops the chain) means the windows can never fight each other.
// 路由改為按名稱指定,不再有固定管線順序

// ---- streaming ----
function fmtElapsed(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return h?`${h}h${m}m`:m?`${m}m${ss}s`:`${ss}s`;}
function newLive(pane){
  const box=document.createElement("div");box.className="msg bot";
  // status line stays BELOW the streaming content for the whole run: "<elapsed> · <tokens> · <word>"
  box.innerHTML=`<div class="who">${paneName(pane)} · …</div><div class="body"></div><div class="thinking"><span class="tt">0s</span><span class="dots">…</span></div>`;
  logs[pane].appendChild(box);
  logs[pane].scrollTop=logs[pane].scrollHeight;
  const L={box,body:box.querySelector(".body"),segs:[],think:box.querySelector(".thinking"),tt:box.querySelector(".tt"),
           start:Date.now(),mainTok:0,thinkTok:0,agentTok:{},timer:null};
  box._L=L;   // let the delegated tool-collapse click handler reach this run's segs
  const words=["thinking","thinking more","still thinking…","ok almost done…"];
  const tick=()=>{const dt=Date.now()-L.start;
    const wi=Math.min(words.length-1,Math.floor(dt/8000));
    const tok=L.mainTok+(L.thinkTok||0)+Object.values(L.agentTok).reduce((a,b)=>a+b,0);
    if(L.tt)L.tt.textContent=`${fmtElapsed(dt)} · ${fmtTok(tok)} tokens · ${words[wi]}`;};
  tick();L.timer=setInterval(tick,1000);
  return L;
}
function toolColor(t){
  if(/^Bash/i.test(t))return'#1A7F3C';
  if(/^Write|^Edit/i.test(t))return'#C45F00';
  if(/^Read/i.test(t))return'#0071E3';
  if(/^Agent|^Task|^TodoWrite/i.test(t))return'#8B5CF6';
  return'#6E6E73';
}
function agentHtml(s,i){
  const run=s.status!=="completed"&&s.st!=="task_updated"&&s.st!=="task_notification";
  const u=s.usage||{};
  const dot=run?'⏳':'✓';
  const dotCol=run?'#B25900':'#1A7F3C';
  const meta=s.sum?(escapeHtml(s.sum)):(run?(u.total_tokens?`${(u.total_tokens/1000).toFixed(0)}k tok · ${u.tool_uses||0} tools`:"waiting…"):"done");
  const events=(s.events||[]);
  const detail=events.length?events.map(ev=>{
    const icon=ev.status==="completed"?'✓':ev.status==="failed"?'✗':'›';
    return `<div class="tdline">${icon} [${escapeHtml(ev.st||'')}] ${escapeHtml(ev.sum||ev.desc||'')} ${ev.usage&&ev.usage.total_tokens?'('+Math.round(ev.usage.total_tokens/1000)+'k)':''}</div>`;
  }).join(''):`<div class="tdline dim">（等待子任務事件）</div>`;
  return `<div class="toolblk${s.open?' open':''}" data-si="${i}">`
       + `<div class="toolhdr"><span class="bullet" style="color:${dotCol}">${dot}</span>`
       + `<span class="tsum" style="color:#8B5CF6">${escapeHtml(s.name||'agent')} <span style="color:#8E8E93;font-weight:400">${escapeHtml(s.desc||'')} · ${meta}</span></span>`
       + `<span class="chev">▸</span></div>`
       + `<div class="tooldetail">${detail}</div></div>`;
}
function segHtml(s,i){
  if(s.type==="compact"){
    const pre=s.pre>=1000?(s.pre/1000).toFixed(0)+"k":s.pre;
    return `<div class="compactrow">✦ 對話已壓縮 · 繼續中 · 原 ${pre} tokens</div>`;
  }
  if(s.type==="shared"){
    const who=(s.from||[]).map(escapeHtml).join("、");
    return `<div class="sharedrow" title="四個視窗讀的是同一份共享內容。這一輪自動帶入了你還沒看過的部分。"><span class="si">🔗</span><span>已帶入共享內容:${s.n} 則,來自 ${who||"其他視窗"}</span></div>`;
  }
  if(s.type==="tool"){
    const col=toolColor(s.t);
    const outs=(s.outs&&s.outs.length)?s.outs.map(o=>{
      const isLong=o.length>120||/\n/.test(o);
      return isLong?`<div class="tdline">⎿</div><div class="toolout-md">${md(o)}</div>`:`<div class="tdline">⎿ ${escapeHtml(o)}</div>`;
    }).join(""):`<div class="tdline dim">⎿ (no output)</div>`;
    return `<div class="toolblk${s.open?' open':''}" data-si="${i}">`
         + `<div class="toolhdr"><span class="bullet" style="color:${col}">⏺</span><span class="tsum">${escapeHtml(s.t)}</span><span class="chev">▸</span></div>`
         + `<div class="tooldetail">${outs}</div></div>`;
  }
  if(s.type==="toolout")return `<div class="toolout"><span class="corner">⎿</span><span>${escapeHtml(s.t)}</span></div>`;
  if(s.type==="agent")return agentHtml(s,i);
  return md(s.t);
}
function renderLive(L){
  L.body.innerHTML=L.segs.map((s,i)=>segHtml(s,i)).join("");   // status line stays live below until done
}
const runningPanes=new Set();
function setRunning(p,on){
  const sb=document.querySelector(`.stopbtn[data-col="${p}"]`);if(sb)sb.disabled=!on;
  if(on)runningPanes.add(p);else runningPanes.delete(p);

}
function finalizeLive(pane,L,ms){
  if(L.timer)clearInterval(L.timer);if(L.think){L.think.remove();L.think=null;}
  L.segs.forEach(s=>{if(s.type==="agent")s.status="completed";});renderLive(L);   // stop any still-spinning agent rows
  const finalText=L.segs.filter(s=>s.type==="text").map(s=>s.t).join("\n");

  const autoTargets=new Set((HANDOFF.edges||[]).filter(e=>e.from===pane&&e.enabled!==false).map(e=>e.to));
  const others=visiblePanes().filter(p=>p!==pane&&!autoTargets.has(p));
  if(others.length){
    const acts=document.createElement("div");acts.className="acts";
    others.forEach(tp=>{
      const btn=document.createElement("button");btn.className="act";
      btn.textContent="→ "+paneName(tp);
      btn.onclick=()=>{
        // 每一次手動轉交都記一筆。這個數字是 M2 唯一的驗收指標:它該逐週往下掉。
        fetch("/api/handoff",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({act:"manual"})}).catch(()=>{});

      };

    L.box.appendChild(acts);
  }
  if(autoTargets.size){
    const note=document.createElement("div");note.className="autonote";

    L.box.appendChild(note);

async function streamRun(tg,text,sysNote,chips){
  const cols=(tg==="all")?visiblePanes():[tg];
  cols.forEach(c=>{if(sysNote)add(c,"sys","",sysNote);else add(c,"user","You",text,chips);});
  const live={};
  cols.forEach(c=>{tags[c].textContent="working…";live[c]=newLive(c);setRunning(c,true);activeStreams.add(c);});
  try{
    const names={};PANES.forEach(p=>names[p]=paneName(p));   // so the shared block names windows the way you named them
    const r=await fetch("/api/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target:tg,text,names})});
    const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let nl;
      while((nl=buf.indexOf("\n"))>=0){const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);if(!line)continue;
        let ev;try{ev=JSON.parse(line);}catch(e){continue;}
        const e=ev.engine,L=live[e];if(!L)continue;
        if(ev.k==="text"){L.segs.push({type:"text",t:ev.t});renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="textstart"){L.segs.push({type:"text",t:""});}
        else if(ev.k==="textdelta"){                     // live typing: append into the open text seg
          let s=L.segs[L.segs.length-1];
          if(!s||s.type!=="text"){s={type:"text",t:""};L.segs.push(s);}
          s.t+=ev.t;renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="think"){L.thinkTok=ev.est||0;}   // live token estimate while still thinking
        else if(ev.k==="tool"){L.segs.push({type:"tool",t:ev.t,outs:[],open:false,got:false});tags[e].textContent="⏺ "+ev.t.split("(")[0].slice(0,18);renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="toolout"){
          let ts=null;for(const s of L.segs){if(s.type==="tool"&&!s.got){ts=s;break;}}   // attach to the first tool still awaiting its result
          if(ts){ts.outs.push(ev.t);ts.got=true;}else{L.segs.push({type:"toolout",t:ev.t});}
          tags[e].textContent="working…";renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="usage"){if(ev.tot!=null)L.mainTok=ev.tot;else L.mainTok+=(ev.out||0);L.thinkTok=0;}  // real count in; drop the estimate
        else if(ev.k==="shared"){L.segs.push({type:"shared",n:ev.n,from:ev.from||[]});renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="compact"){L.segs.push({type:"compact",pre:ev.pre||0,trigger:ev.trigger||"auto"});renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="sysnote"){L.segs.push({type:"text",t:"[system] "+ev.t});renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="agent"){
          let seg=L.segs.find(s=>s.type==="agent"&&s.id===ev.id);
          if(!seg){seg={type:"agent",id:ev.id,events:[]};L.segs.push(seg);}
          seg.name=ev.name||seg.name;seg.desc=ev.desc||seg.desc;seg.st=ev.st;
          if(ev.status)seg.status=ev.status;if(ev.sum)seg.sum=ev.sum;if(ev.usage&&Object.keys(ev.usage).length)seg.usage=ev.usage;
          if(ev.usage&&ev.usage.total_tokens)L.agentTok[ev.id]=ev.usage.total_tokens;
          seg.events.push({st:ev.st,desc:ev.desc||'',sum:ev.sum||'',status:ev.status||'',usage:ev.usage||{}});
          renderLive(L);logs[e].scrollTop=logs[e].scrollHeight;}
        else if(ev.k==="done"){tags[e].textContent="idle";setRunning(e,false);if(ev.sid&&ev.sid!==activeId[e]){activeId[e]=ev.sid;railSig[e]=null;}finalizeLive(e,L,ev.ms||0);loadRail(e,true);}
        else if(ev.k==="need_login"){
          tags[e].textContent="idle";setRunning(e,false);finalizeLive(e,L,0);
          add(e,"sys","",`Claude on ${ev.remote} is not logged in.`);
          const lb=document.querySelector(`.loginbtn[data-col="${e}"]`);
          if(lb){lb.style.display="";lb.onclick=()=>loginRemote(e,ev.remote,lb);}
        }
      }}
    cols.forEach(c=>{if(tags[c].textContent==="working…")tags[c].textContent="idle";setRunning(c,false);killThink(live[c]);activeStreams.delete(c);});
  }catch(err){cols.forEach(c=>{tags[c].textContent="idle";setRunning(c,false);killThink(live[c]);activeStreams.delete(c);add(c,"sys","","[stream failed] "+err);});}
}
// hand a CLEAN TASK forward to the next-stage window `tg`. What travels is that window's OWN
// role brief (what IT must do) plus the upstream RESULT as task source material — framed as
// "抽出要做的事去執行", NOT "接續這段對話". So the next window receives an order, not a chat
// transcript. crossTask() builds exactly the string that gets sent, so it can be logged/inspected.
function crossTask(tg,srcText,srcPane){
  const src=(srcText||"").trim();
  const who=srcPane?paneName(srcPane):"上一棒";
  return roleBrief(tg)
    + "\n\n=== 交辦任務 ===\n"
    + "上面是「"+who+"」談定的結果。把它當成這一棒的『任務來源』:從中抽出『要做什麼』,"
    + "直接執行你上面的職責。這是交棒給你的任務,不是要你覆述、接續或評論那段對話逐字。\n\n"
    + "--- 來源結果(供你萃取任務,不要照抄) ---\n" + src;
}
function crossFeed(tg,srcText,srcPane){
  if(!tg)return;
  streamRun(tg,crossTask(tg,srcText,srcPane),"↳ 管線接手 · "+paneName(tg));
}

function switchEngine(pane,eng){const sel=document.querySelector(`.engsel[data-col="${pane}"]`);if(sel&&sel.value!==eng){sel.value=eng;sel.dispatchEvent(new Event("change"));}}
const cmdmenu=document.createElement("div");cmdmenu.className="cmdmenu";document.querySelector(".inputwrap").appendChild(cmdmenu);
function slashQuery(){const v=box.value;if(v[0]!=="/"||/\s/.test(v))return null;return v.slice(1).toLowerCase();}
function renderCmd(){
  const q=slashQuery();
  if(q===null){closeCmd();return;}
  cmdList=SLASH.filter(c=>c.c.startsWith(q)||c.en.toLowerCase().includes(q)||c.zh.includes(q));
  if(!cmdList.length){closeCmd();return;}
  cmdOpen=true;if(cmdIdx>=cmdList.length)cmdIdx=cmdList.length-1;if(cmdIdx<0)cmdIdx=0;
  cmdmenu.innerHTML=cmdList.map((c,i)=>`<div class="cmdit${i===cmdIdx?' sel':''}" data-i="${i}"><span class="cc">/${c.c}</span><span class="ce">${escapeHtml(c.en)}</span><span class="cz">${escapeHtml(c.zh)}</span></div>`).join("");
  cmdmenu.classList.add("on");
}
function closeCmd(){cmdOpen=false;cmdmenu.classList.remove("on");cmdmenu.innerHTML="";}
function runCmd(i){const c=cmdList[i];box.value="";box.style.height="40px";closeCmd();cmdIdx=0;if(c)c.run();}
cmdmenu.addEventListener("mousedown",e=>{const it=e.target.closest(".cmdit");if(it){e.preventDefault();runCmd(+it.dataset.i);}});
box.addEventListener("input",renderCmd);
document.addEventListener("keydown",e=>{   // capture phase, runs before the composer's own key handlers
  if(!cmdOpen)return;
  if(e.key==="ArrowDown"){e.preventDefault();e.stopImmediatePropagation();cmdIdx=(cmdIdx+1)%cmdList.length;renderCmd();}
  else if(e.key==="ArrowUp"){e.preventDefault();e.stopImmediatePropagation();cmdIdx=(cmdIdx-1+cmdList.length)%cmdList.length;renderCmd();}
  else if(e.key==="Enter"){e.preventDefault();e.stopImmediatePropagation();runCmd(cmdIdx);}
  else if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();closeCmd();}
  else if(e.key==="Tab"){e.preventDefault();e.stopImmediatePropagation();cmdIdx=(cmdIdx+(e.shiftKey?-1:1)+cmdList.length)%cmdList.length;renderCmd();}
},true);

async function stopPane(pane){try{await fetch("/api/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pane})});}catch(e){}}
function loginRemote(pane,remote,btn){
  if(btn)btn.style.display="none";
  add(pane,"sys","",`Logging in to ${remote}…`);
  const es=new EventSource(`/api/remote-login?remote=${encodeURIComponent(remote)}`);
  es.onmessage=ev=>{
    try{
      const d=JSON.parse(ev.data);
      if(d.error){add(pane,"sys","",`[SSH error] ${d.error}`);es.close();if(btn)btn.style.display="";}
      else if(d.done){
        add(pane,"sys","",`Login stream ended (rc=${d.rc})`);
        es.close();
        if(d.rc!==0&&btn)btn.style.display="";
      } else if(d.line!==undefined){
        const line=d.line;
        // detect URL in line and make it clickable
        const urlMatch=line.match(/https?:\/\/\S+/);
        if(urlMatch){
          const before=line.slice(0,line.indexOf(urlMatch[0]));
          const url=urlMatch[0];
          const after=line.slice(line.indexOf(urlMatch[0])+url.length);
          const wrap=document.createElement("div");
          wrap.className="msg sys";
          wrap.innerHTML=`<span class="label"></span><span class="body">${escapeHtml(before)}<a href="${url}" target="_blank" style="color:#1E8E3E;word-break:break-all">${url}</a>${escapeHtml(after)}</span>`;
          logs[pane].appendChild(wrap);logs[pane].scrollTop=logs[pane].scrollHeight;
        } else {
          add(pane,"sys","",line);
        }
      }
    }catch(e){}
  };
  es.onerror=()=>{add(pane,"sys","","[login connection lost]");es.close();if(btn)btn.style.display="";};
}

function renderHandoffUI(){

  document.querySelectorAll(".respbtn").forEach(b=>{

    let lab=b.querySelector(".rlabel");

  }).join("");
  pop.innerHTML=`<div class="hhead">${escapeHtml(from.toUpperCase()+" · "+paneName(from))} 做完之後（目前停用）</div>${rows}
    <div class="hfoot">規則存在後端,關掉視窗也還在。手動轉交 ${HANDOFF.stats.manual||0} 次 · 自動 ${HANDOFF.stats.auto||0} 次</div>`;
  pop.onclick=ev=>{
    const o=ev.target.closest(".hopt");if(!o)return;
    ev.stopPropagation();
    // 暫時停用:規則存的是 w1..w4 代號,面板顯示的是名字,改名之後兩者脫鉤,

    alert("這個功能暫時停用。\n\n原因:規則記的是視窗代號,面板顯示的是名字。改名字之後兩者對不起來,會送到跟畫面上寫的不同的視窗。\n\n修好之前不讓妳再按到一次亂送。");
  };
  // 掛在 colhead 而不是按鈕內部:button 的內容模型不允許再包 button,
  // 面板裡有按鈕,塞進去瀏覽器會把它拆掉,結果就是點了沒反應。
  const head=b.closest(".colhead");

async function loadRail(pane,force){
  const eng=paneEngine[pane];let rows;

    if(!r.ok){if(!railInit[pane])rails[pane].innerHTML=`<div style='padding:10px;color:#FF3B30;font-size:11px'>[HTTP ${r.status}] open http://localhost:8765</div>`;return;}

  const sig=JSON.stringify(rows.map(s=>[s.id,s.title||s.first,s.ts,!!s.pinned,!!s.archived,s.project]));
  if(!force&&sig===railSig[pane])return;railSig[pane]=sig;renderRail(pane,rows);

function renderRail(pane,rows){
  const scroll=rails[pane].scrollTop;
  if(!rows.length){rails[pane].innerHTML="<div style='padding:10px;color:#AEAEB2'>(no sessions)</div>";railInit[pane]=true;return;}
  const groups={};rows.forEach(s=>{(groups[s.project||s.cwd||"(unknown)"] ||= []).push(s);});
  const order=Object.keys(groups).sort((a,b)=>Math.max(...groups[b].map(x=>x.ts))-Math.max(...groups[a].map(x=>x.ts)));
  if(!railInit[pane])order.forEach((label,gi)=>{if(gi>0)collapsedG[pane].add(label);});
  rails[pane].innerHTML="";
  order.forEach(label=>{
    const list=groups[label].sort((a,b)=>b.ts-a.ts);const cwd=list[0].cwd||"";
    const g=div("sgroup"+(collapsedG[pane].has(label)?" collapsed":""));
    const head=div("ghead");head.innerHTML=`<span class="arr">▾</span><span class="gname" title="${escapeHtml(cwd)}">${escapeHtml(label)}</span><span class="gcount">${list.length}</span>`;
    head.onclick=()=>{g.classList.toggle("collapsed");g.classList.contains("collapsed")?collapsedG[pane].add(label):collapsedG[pane].delete(label);};
    g.appendChild(head);const body=div("gbody");
    list.forEach(s=>{
      const el=document.createElement("div");
      el.className="sitem"+(s.pinned?" pin":"")+(s.archived?" arch":"")+(s.id===activeId[pane]?" active":"");
      el.dataset.id=s.id;const lab=s.title||s.first||"(untitled)";
      const dt=new Date(s.ts*1000).toLocaleString("en-US",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
      el.title=`${dt} · ${s.id.slice(0,8)}\n${s.cwd||""}`;
      el.innerHTML=`<span class="ico">${s.pinned?"●":"○"}</span><span class="lbl">${escapeHtml(lab)}</span><span class="dots" title="more">⋮</span>`;
      el.onclick=(e)=>{if(e.target.classList.contains("dots")){e.stopPropagation();openMenu(e,pane,s);}else loadSession(pane,s,el);};
      body.appendChild(el);
    });
    g.appendChild(body);rails[pane].appendChild(g);
  });
  railInit[pane]=true;rails[pane].scrollTop=scroll;
}

// ---- liveness watcher: server truth for "alive or dead" ----
// After a refresh, a window whose CLI is still running server-side gets its thinking
// indicator back; when it finishes, the answer is pulled into the log automatically.
let engChangedAt={};   // pane -> ts of a local engine change, to avoid a race reverting it
setInterval(async()=>{
  let st;try{st=await(await fetch("/api/state")).json();}catch(e){return;}
  for(const p of PANES){
    // reconcile engine to the server's truth (backend is persisted & authoritative)
    const be=st[p]&&st[p].engine;
    if(be&&be!==paneEngine[p]&&(Date.now()-(engChangedAt[p]||0))>3000){
      paneEngine[p]=be;
      const sel=document.querySelector(`.engsel[data-col="${p}"]`);if(sel)sel.value=be;
      updatePaneEngineUI(p);
    }
    const run=!!(st[p]&&st[p].running);
    if(run&&!activeStreams.has(p)&&!orphanLive[p]){
      orphanLive[p]=newLive(p);tags[p].textContent="working…";setRunning(p,true);
    }else if(!run&&orphanLive[p]){
      const L=orphanLive[p];orphanLive[p]=null;
      killThink(L);L.box.remove();
      tags[p].textContent="idle";setRunning(p,false);
      if(st[p]&&st[p].id){
        try{
          const r=await fetch("/api/load",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({pane:p,engine:paneEngine[p],id:st[p].id,cwd:st[p].cwd})});
          const data=await r.json();
          if(data.transcript&&data.transcript.length){
            logs[p].innerHTML="";
            data.transcript.forEach(mm=>add(p,(mm.role==="user"?"user":"bot")+" old",mm.role==="user"?"You (old)":paneName(p)+" (old)",mm.text));
            const lastBot=[...data.transcript].reverse().find(mm=>mm.role!=="user");
            if(lastBot)lastOutput[p]=lastBot.text;
          }
        }catch(e){}
      }
    }
  }
},3000);

async function refreshBehavior(){
  try{const data=await(await fetch("/api/behavior")).json();const arr=data.records||[],streak=data.streak||{};
    const el=document.getElementById("bstrip");
    if(!arr.length&&!Object.values(streak).some(v=>v>=3)){el.innerHTML='<span class="bnote">Set a project + a write-mode: each turn compares what the AI claims vs. what changed on disk</span>';return;}
    let h="";Object.keys(streak).forEach(e=>{if(streak[e]>=3)h+=`<span class="bpill circle" title="${streak[e]} turns claiming progress with 0 disk changes">🌀 ${escapeHtml(paneName(e))} looping ${streak[e]}×</span>`;});
    const warns=arr.filter(r=>r.verdict==="warn"&&!r.circling);const okc=arr.filter(r=>r.verdict==="ok").length;
    h+=`<span class="bpill ok">✓ ${okc} consistent</span>`;
    if(warns.length){h+=`<span class="bpill warn">⚠ ${warns.length} suspicious</span>`;
      warns.slice(0,2).forEach(r=>{let detail=r.reason||"";const miss=r.claims.filter(c=>c.status==="missing"||c.status==="empty").map(c=>c.path).join(", ");if(miss)detail+=": "+miss;
        h+=`<span class="bpill warn" title="${escapeHtml(paneName(r.engine)+" · "+detail)}">${escapeHtml(paneName(r.engine))}: ${escapeHtml(detail).slice(0,44)}</span>`;});}
    el.innerHTML=h;
  }catch(e){}
}

const fileinput=document.getElementById("fileinput");
const pendingFiles=[];
function fileIcon(name){
  const e=(name.split(".").pop()||"").toLowerCase();
  if(/^(mp4|mov|avi|mkv|webm)$/.test(e))return "🎬";
  if(/^(mp3|wav|m4a|flac|aac)$/.test(e))return "🎵";
  if(/^(zip|gz|tar|rar|7z|dmg)$/.test(e))return "📦";
  if(/^(csv|xlsx|xls|numbers)$/.test(e))return "📊";
  if(/^(pdf)$/.test(e))return "📕";
  return "📄";
}
const MAX_FILES=10;
async function addFiles(files){
  const room=MAX_FILES-pendingFiles.length;
  if(room<=0){alert(`一次最多 ${MAX_FILES} 個檔案,目前已經滿了,先移除幾個再加`);return;}
  const list=[...files];
  if(list.length>room)alert(`一次最多 ${MAX_FILES} 個檔案,只加了前 ${room} 個,其餘 ${list.length-room} 個沒加`);
  for(const f of list.slice(0,room)){
    try{
      const buf=await f.arrayBuffer();
      const r=await fetch("/api/upload",{method:"POST",headers:{"X-Filename":encodeURIComponent(f.name)},body:buf});
      const d=await r.json();
      if(!d.ok){alert("Upload failed: "+(d.error||""));continue;}
      const isImg=/\.(png|jpe?g|gif|webp|svg|bmp|heic)$/i.test(f.name);
      pendingFiles.push({rel:d.rel,name:f.name,img:isImg?URL.createObjectURL(f):null});
    }catch(e){alert("Upload failed: "+e);}
  }
  renderChips();
}
function renderChips(){
  const c=document.getElementById("chips");c.innerHTML="";
  pendingFiles.forEach((f,i)=>{
    const d=document.createElement("div");d.className="chip";d.title=f.name;
    d.innerHTML=(f.img?`<img src="${f.img}">`:`<span class="fic">${fileIcon(f.name)}</span>`)+`<span class="x">×</span>`;
    d.querySelector(".x").onclick=()=>{pendingFiles.splice(i,1);renderChips();};
    c.appendChild(d);
  });
  c.style.display=pendingFiles.length?"flex":"none";
}
function chipsHtml(){
  if(!pendingFiles.length)return "";
  return `<div class="msgchips">`+pendingFiles.map(f=>f.img
    ?`<img src="${f.img}" title="${escapeHtml(f.name)}">`
    :`<span title="${escapeHtml(f.name)}">${fileIcon(f.name)}</span>`).join("")+`</div>`;
}
document.getElementById("plusbtn").onclick=()=>{fileinput.value="";fileinput.click();};
fileinput.onchange=()=>addFiles(fileinput.files);
// click a tool summary row to expand/collapse its detail (works live and after the run finishes)
document.addEventListener("click",e=>{
  const hdr=e.target.closest(".toolhdr");if(!hdr)return;
  const blk=hdr.closest(".toolblk");if(!blk)return;
  const box=hdr.closest(".msg"),si=blk.dataset.si!=null?+blk.dataset.si:-1;
  if(box&&box._L&&si>=0&&box._L.segs[si]){box._L.segs[si].open=!box._L.segs[si].open;blk.classList.toggle("open",box._L.segs[si].open);}
  else blk.classList.toggle("open");   // restored/static transcript: just toggle the DOM
});
// click a blue file path -> reveal it in Finder (open -R on the backend)
function toast(msg,bad){
  let t=document.getElementById("duotoast");
  if(!t){t=document.createElement("div");t.id="duotoast";t.className="toast";document.body.appendChild(t);}
  t.textContent=msg;t.style.borderColor=bad?"#FF3B30":"var(--line)";
  t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2400);
}
document.addEventListener("click",async e=>{
  const fp=e.target.closest(".fpath");if(!fp)return;
  const path=fp.textContent.trim();
  const paneEl=fp.closest("[data-pane]"),pane=paneEl?paneEl.dataset.pane:null;
  try{
    const r=await fetch("/api/open-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path,pane})});
    const d=await r.json();
    toast(d.ok?("→ Finder："+path):("找不到檔案："+path),!d.ok);
  }catch(err){toast("開檔失敗："+path,true);}
});
// document-level drag&drop: dropping anywhere on the page attaches files (and never navigates away)
let dragDepth=0;
document.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;document.body.classList.add("dragover");});
document.addEventListener("dragover",e=>{e.preventDefault();});
document.addEventListener("dragleave",e=>{e.preventDefault();dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)document.body.classList.remove("dragover");});
document.addEventListener("drop",e=>{
  e.preventDefault();dragDepth=0;document.body.classList.remove("dragover");
  if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
